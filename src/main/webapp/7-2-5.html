<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<input type="text" id="email">
	<p id="result"></p>
	
	
	<script type="text/javascript">
		let isEmail = function() {	// ab@naver.com
			// @ 문자 앞에 2자 이상 존재
			let ch1 = value.indexOf('@') > 1;
			// @ 뒤 문자는 .문자 앞에 2자 이상 존재
			let ch2 = false
				if(ch1) {
					let arr = value.split('@'); // arr[0] 기준으로 @ 앞에 문자, arr[1] : @ 뒤에 문자가 된다.
					ch2 = arr[1].indexOf('.') > 1;
				}
			let ch3 = false;
			if(ch2) {
				// arr[1] 에서 마지막 .의 뒤에 위치를 구해서 글자가 2자이거나 3자이면 참.
			}
			return ch2;
				
			/*
				010-xxxx-xxxx
				1) split('-') lenght -> 3
				2) arr[1], arr[2], arr[3] isNaN -> false
				3) arr[0]. length -> 3
				4) arr[1], arr[3] length -> 4
			
			
			*/
		};
	
		let email = document.querySelector('#email');
		let result = document.querySelector('#result');
		
		email.addEventListener('keyup', function(e) {
			// email.value
			// this.value
			// e.currentTarget.value
			if(isEmail(this.value)){
				result.textContent = '사용 가능한 이메일입니다';
			} else {
				result.textContent = '이메일 형식이 아닙니다';
			}
		});
	</script>
</body>
</html>
