<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>카카오톡 채팅방 스타일</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #cfd9df;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }

    .chat-container {
      max-width: 500px;
      margin: 40px auto;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 90vh;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      background-color: #fff;
    }

    .chat-header-custom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #e4e7ea;
      padding: 10px 16px;
      border-bottom: 1px solid #ccc;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .chat-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-header-left img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
    }

    .chat-header-center {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .chat-header-title {
      font-weight: 600;
      font-size: 14px;
    }

    .chat-header-sub {
      font-size: 12px;
      color: #666;
    }

    .chat-header-icons i {
      font-size: 18px;
      color: #333;
      margin-left: 12px;
      cursor: pointer;
    }

    .chat-body {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background-color: #cfd9df;
      display: flex;
      flex-direction: column;
    }

    .message-block {
      display: flex;
      align-items: flex-end;
      margin-bottom: 10px;
      gap: 8px;
    }

    .message-block.right {
      flex-direction: row-reverse;
    }

    .profile-img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
    }

    .message {
      position: relative;
      background-color: #fff;
      border-radius: 18px;
      padding: 10px 14px;
      font-size: 14px;
      max-width: 70%;
      min-width: 80px;
      word-break: break-word;
    }

    .message.right {
      background-color: #fef01b;
    }

    .message::after {
      content: '';
      position: absolute;
      bottom: 0;
      width: 0;
      height: 0;
      border: 8px solid transparent;
    }

    .message.right::after {
      border-left-color: #fef01b;
      right: -10px;
      bottom: 10px;
    }

    .message:not(.right)::after {
      border-right-color: #fff;
      left: -10px;
      bottom: 10px;
    }

    .timestamp {
      display: block;
      text-align: right;
      font-size: 11px;
      color: #999;
      margin-top: 4px;
    }

    .sender-name {
      font-size: 12px;
      color: #777;
      margin-bottom: 2px;
    }

    .system-message {
      align-self: center;
      background-color: #ececec;
      padding: 6px 10px;
      border-radius: 14px;
      font-size: 12px;
      color: #555;
      margin: 10px 0;
    }

    .chat-footer {
      background-color: #f0f0f0;
      padding: 8px;
    }

    .input-container {
      background-color: #ffffff;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 6px 10px;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .input-container textarea {
      flex: 1;
      border: none;
      resize: none;
      outline: none;
      font-size: 14px;
      background: transparent;
      padding: 6px;
    }

    .input-container button {
      background: none;
      border: none;
      font-size: 20px;
      margin: 0 6px;
      cursor: pointer;
    }

    #currentSpeaker {
      font-size: 13px;
      color: #555;
      padding-left: 14px;
      padding-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header-custom">
      <div class="chat-header-left">
        <img src="/upload/go.png" alt="그룹프로필">
        <div class="chat-header-center">
          <div class="chat-header-title">밀짚모자해적단</div>
          <div class="chat-header-sub">👥 10</div>
        </div>
      </div>
      <div class="chat-header-icons">
        <i class="bi bi-search"></i>
        <i class="bi bi-telephone"></i>
        <i class="bi bi-camera-video"></i>
        <i class="bi bi-list"></i>
      </div>
    </div>

    <div class="chat-body" id="chatBox">
      <div class="system-message">2024년 5월 12일 월요일</div>
      <div class="system-message">채팅을 시작합니다.</div>
    </div>

    <div class="chat-footer">
      <div class="input-container">
        <button onclick="toggleSpeaker()">➕</button>
        <textarea id="messageInput" rows="1" placeholder="메시지 입력" oninput="toggleSendButton()"></textarea>
        <button onclick="alert('이모지')">😊</button>
        <button onclick="alert('기능')">#️⃣</button>
        <button id="sendBtn" onclick="sendMessage()" style="display: none;">✈️</button>
      </div>
      <div id="currentSpeaker">
        <img src="/upload/lu.png" width="24" height="24" class="rounded-circle">
        <span>루피로 채팅 중...</span>
      </div>
    </div>
  </div>

  <script>
    let currentSpeaker = 'luffy';

    function getCurrentTime() {
      const now = new Date();
      let hour = now.getHours();
      const minute = now.getMinutes().toString().padStart(2, '0');
      const period = hour >= 12 ? '오전' : '오후';
      hour = hour % 12 || 12;
      return `${period} ${hour}:${minute}`;
    }

    function updateSpeakerUI() {
      const container = document.getElementById("currentSpeaker");
      container.innerHTML = `
        <img src="/upload/${currentSpeaker === 'luffy' ? 'lu.png' : 'jo.png'}" width="24" height="24" class="rounded-circle">
        <span>${currentSpeaker === 'luffy' ? '루피' : '조로'}로 채팅 중...</span>
      `;
    }

    function toggleSpeaker() {
      currentSpeaker = currentSpeaker === 'luffy' ? 'zoro' : 'luffy';
      updateSpeakerUI();
    }

    function appendMessage(text, side) {
      const chatBox = document.getElementById("chatBox");
      const block = document.createElement("div");
      block.className = "message-block" + (side === 'right' ? ' right' : '');

      const profile = document.createElement("img");
      profile.src = side === 'right' ? "/upload/jo.png" : "/upload/lu.png";
      profile.className = "profile-img";

      const wrapper = document.createElement("div");
      const name = document.createElement("div");
      name.className = "sender-name";
      name.innerText = side === 'right' ? '조로' : '루피';

      const msg = document.createElement("div");
      msg.className = "message" + (side === 'right' ? ' right' : '');
      msg.innerHTML = `${text}<span class="timestamp">${getCurrentTime()}</span>`;

      wrapper.appendChild(name);
      wrapper.appendChild(msg);

      block.appendChild(profile);
      block.appendChild(wrapper);

      chatBox.appendChild(block);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();
      if (!text) return;
      appendMessage(text, currentSpeaker === 'luffy' ? 'left' : 'right');
      input.value = '';
      toggleSendButton();
    }

    function toggleSendButton() {
      const input = document.getElementById("messageInput");
      const sendBtn = document.getElementById("sendBtn");
      sendBtn.style.display = input.value.trim() ? "inline" : "none";
    }

    updateSpeakerUI();
  </script>
</body>
</html>
